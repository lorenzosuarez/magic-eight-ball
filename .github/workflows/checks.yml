name: Checks

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Without google-services.json, which is not in the repository, the apps build with no
      # Firebase: the tests need none. The screenshots are drawn, which runs every screen, and
      # are not compared: a runner's fonts are not a developer's.
      - name: Unit and screenshot tests
        run: >
          ./gradlew
          :core:domain:test :core:data:testDebugUnitTest :feature:chat:testDebugUnitTest
          :app-phone:testDebugUnitTest :app-wear:testDebugUnitTest
          -Proborazzi.test.record=true
      - name: Lint
        run: ./gradlew :app-phone:lintDebug
      - name: Keep the reports of a run that failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests
            **/build/reports/lint-results-*.html
          retention-days: 7

  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm --prefix functions ci
      - run: npm --prefix functions test

  site:
    name: Site builds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # As a draft: a text waiting for its date must not stop the checks, only its publishing.
      - run: python3 site/build.py --draft
